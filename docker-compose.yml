services:
  db:
    image: postgres:16-alpine
    container_name: ai-ticket-triage-db
    environment:
      POSTGRES_USER: ticketuser
      POSTGRES_PASSWORD: ticketpass
      POSTGRES_DB: tickets
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketuser -d tickets"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: ai-ticket-triage-api
    environment:
      DATABASE_URL: postgresql+psycopg://ticketuser:ticketpass@db:5432/tickets
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
